name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'a tag a empacotar (ex.: v1.0.3)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.version }}
      versao: ${{ steps.check.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      - name: a tag bate com o Cargo.toml?
        id: check
        run: |
          set -euo pipefail
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$v" ]; then
            echo "::error::a tag é $TAG e o Cargo.toml diz $v -- rode 'make bump V=...' antes de taguear."
            exit 1
          fi
          echo "maestria $v"
          echo "versao=$v" >> "$GITHUB_OUTPUT"
      - id: rust
        run: echo "version=$(sed -n 's/^RUST_VERSION ?= *//p' Makefile)" >> "$GITHUB_OUTPUT"

  deb:
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      # O cache só se lê aqui: quem o grava é o cache.yml, na main. O cache de
      # uma tag fica preso a ela e nenhum release seguinte o enxergaria.
      - uses: actions/cache/restore@v6
        with:
          path: |
            target-deb/cargo-home/registry
            target-deb/cargo-home/git
            target-deb/target
          key: deb-${{ needs.versao.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: deb-${{ needs.versao.outputs.rust }}-
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: packaging/linux
          build-args: RUST_VERSION=${{ needs.versao.outputs.rust }}
          tags: maestria-rs-deb:${{ needs.versao.outputs.rust }}
          load: true
          cache-from: type=gha,scope=deb-image-${{ needs.versao.outputs.rust }}
      - run: ./packaging/linux/build-deb.sh --variant rs
        env:
          RUST_VERSION: ${{ needs.versao.outputs.rust }}
          MAESTRIA_VERSION: ${{ needs.versao.outputs.versao }}
          DEB_IMAGE_PREBUILT: 1
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-deb
          path: packaging/linux/dist/*.deb
          if-no-files-found: error

  # Uma arquitetura por máquina, em paralelo: o LTO fat de cada uma é quase
  # todo serial, então duas máquinas fazem em ~metade do tempo de uma.
  mac-bin:
    needs: versao
    runs-on: macos-15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versao.outputs.rust }}
          targets: ${{ matrix.target }}
      # Só as dependências, gravadas pelo cache.yml na main; aqui só se lê.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac-${{ matrix.target }}
          save-if: false
      - run: cargo build -p mx-app --release --locked --target ${{ matrix.target }}
        env:
          MAESTRIA_VERSION: ${{ needs.versao.outputs.versao }}
      # O .app (ícones, Info.plist) sai de um lado só; o make-dmg troca o
      # binário dele pelo universal.
      - if: matrix.target == 'aarch64-apple-darwin'
        uses: taiki-e/install-action@v2
        with: { tool: cargo-bundle }
      - if: matrix.target == 'aarch64-apple-darwin'
        working-directory: crates/mx-app
        run: cargo bundle --release --target ${{ matrix.target }} --format osx
        env:
          MAESTRIA_VERSION: ${{ needs.versao.outputs.versao }}
      - run: |
          mkdir -p out/${{ matrix.target }}/release
          cp target/${{ matrix.target }}/release/maestria out/${{ matrix.target }}/release/
          if [ -d target/${{ matrix.target }}/release/bundle ]; then
            cp -R target/${{ matrix.target }}/release/bundle out/${{ matrix.target }}/release/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mac-bin-${{ matrix.target }}
          path: out
          if-no-files-found: error
          retention-days: 1

  dmg:
    needs: [versao, mac-bin]
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-bin-*
          path: target
          merge-multiple: true
      # O artifact não guarda o bit de execução.
      - run: chmod +x target/*/release/maestria target/*/release/bundle/osx/*.app/Contents/MacOS/*
      - run: ./packaging/macos/make-dmg.sh --no-build
        env:
          MAESTRIA_VERSION: ${{ needs.versao.outputs.versao }}
          TARGET_DIR: ${{ github.workspace }}/target
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-dmg
          path: packaging/macos/dist/*.dmg
          if-no-files-found: error

  msi:
    needs: versao
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versao.outputs.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - run: ./packaging/windows/make-msi.ps1
        shell: pwsh
        env:
          MAESTRIA_VERSION: ${{ needs.versao.outputs.versao }}
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-msi
          path: packaging/windows/dist/*.msi
          if-no-files-found: error

  publicar:
    needs: [deb, dmg, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      - uses: actions/download-artifact@v8
        with: { path: anexos, pattern: 'pkg-*', merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh anexos
          (cd anexos && shopt -s nullglob && sha256sum *.deb *.dmg *.msi > SHA256SUMS && cat SHA256SUMS)
          : > notas.md
          [ -f "packaging/changelog/$TAG.md" ] && { cat "packaging/changelog/$TAG.md"; echo; } >> notas.md
          sed "s/{TAG}/$TAG/g" packaging/NOTAS-DA-RELEASE.md >> notas.md
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" anexos/* --clobber \
            || gh release create "$TAG" anexos/* \
                 --title "maestria-rs ${TAG#v}" \
                 --notes-file notas.md
