name: release-retry

# Re-roda o release quando um job ficou sem máquina. Os runners macOS arm64 do
# GitHub vivem sem capacidade: o job fica na fila, o GitHub desiste em ~15 min
# ("The job was not acquired by Runner of type hosted even after multiple
# attempts") e o dmg e o publicar são pulados. Até aqui isso era um
# `gh run rerun --failed` na mão a cada release.
#
# Só re-roda quando algum job foi cancelado sem nunca ter pegado um runner:
# erro de build de verdade não é repetido. No máximo 3 tentativas.

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          stuck=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" --paginate \
            -q '.jobs[] | select(.conclusion == "cancelled" and ((.runner_name // "") == "")) | .name')
          if [ -z "$stuck" ]; then
            echo "nenhum job ficou sem runner: a falha é de verdade, não re-rodo."
            exit 0
          fi
          echo "sem runner na tentativa $ATTEMPT:"
          echo "$stuck"
          gh run rerun "$RUN" --failed --repo "$REPO"
