[package]
name = "mx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cockpit para sessões do Claude Code"

[[bin]]
name = "maestria"
path = "src/main.rs"

[dependencies]
mx-term.workspace = true
mx-theme.workspace = true
mx-core.workspace = true
mx-store.workspace = true
mx-sys.workspace = true
mx-claude.workspace = true
mx-plugins.workspace = true
mx-rfw = { path = "../mx-rfw" }
regex.workspace = true
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
chrono.workspace = true
serde_json.workspace = true
gpui.workspace = true
anyhow.workspace = true
async-channel.workspace = true
log.workspace = true
env_logger.workspace = true
# xattr 0.2.3 (via gpui_http_client -> zed-async-tar) needs libc::ENOATTR, removed in libc 0.2.190
libc.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "maestria"
maintainer = "Matheus Pano <matheus@marrow.com.br>"
copyright = "2026, br.com.marrow"
section = "devel"
priority = "optional"
revision = "1"
default-features = true
extended-description = """\
Painéis lado a lado, cada um com uma sessão do Claude Code viva dentro,
worktrees do git por tarefa e um leitor de markdown para o que as sessões
escrevem. Requer o Claude Code CLI (claude) instalado e no PATH."""
depends = "$auto, libvulkan1, mesa-vulkan-drivers | vulkan-icd, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libxcb1, fontconfig, git, libnotify-bin, xdg-utils, curl"
recommends = "dbus-x11"
maintainer-scripts = "../../packaging/linux/debian/"
assets = [
  ["target/release/maestria", "opt/maestria/maestria", "755"],
  ["../../packaging/linux/maestria-launcher.sh", "usr/bin/maestria", "755"],
  ["../../packaging/linux/br.com.marrow.maestria.desktop", "usr/share/applications/br.com.marrow.maestria.desktop", "644"],
  ["assets/icons/32.png", "usr/share/icons/hicolor/32x32/apps/br.com.marrow.maestria.png", "644"],
  ["assets/icons/64.png", "usr/share/icons/hicolor/64x64/apps/br.com.marrow.maestria.png", "644"],
  ["assets/icons/128.png", "usr/share/icons/hicolor/128x128/apps/br.com.marrow.maestria.png", "644"],
  ["assets/icons/256.png", "usr/share/icons/hicolor/256x256/apps/br.com.marrow.maestria.png", "644"],
  ["assets/icons/512.png", "usr/share/icons/hicolor/512x512/apps/br.com.marrow.maestria.png", "644"],
]

[package.metadata.deb.variants.rs]
name = "maestria-rs"
assets = [
  ["target/release/maestria", "opt/maestria-rs/maestria-rs", "755"],
  ["../../packaging/linux/maestria-rs-launcher.sh", "usr/bin/maestria-rs", "755"],
  ["../../packaging/linux/br.com.marrow.maestria-rs.desktop", "usr/share/applications/br.com.marrow.maestria-rs.desktop", "644"],
  ["assets/icons/32.png", "usr/share/icons/hicolor/32x32/apps/br.com.marrow.maestria-rs.png", "644"],
  ["assets/icons/64.png", "usr/share/icons/hicolor/64x64/apps/br.com.marrow.maestria-rs.png", "644"],
  ["assets/icons/128.png", "usr/share/icons/hicolor/128x128/apps/br.com.marrow.maestria-rs.png", "644"],
  ["assets/icons/256.png", "usr/share/icons/hicolor/256x256/apps/br.com.marrow.maestria-rs.png", "644"],
  ["assets/icons/512.png", "usr/share/icons/hicolor/512x512/apps/br.com.marrow.maestria-rs.png", "644"],
]

[package.metadata.bundle]
name = "MaestrIA-rs"
identifier = "br.com.marrow.maestria-rs"
icon = ["assets/icons/32.png", "assets/icons/64.png", "assets/icons/128.png", "assets/icons/256.png", "assets/icons/512.png", "assets/icons/1024.png"]
copyright = "Copyright © 2026 br.com.marrow. All rights reserved."
category = "public.app-category.developer-tools"
short_description = "Cockpit para sessões do Claude Code"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
